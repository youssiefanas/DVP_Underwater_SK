/**:
  ros__parameters:
    # Shared parameters. Dataset-specific image topic and camera intrinsics
    # are defined in config/datasets/*.yaml and overlaid at launch.
    matcher_type: "NORM_HAMMING" # "NORM_HAMMING" | "NORM_L2"
    # NORM_HAMMING is faster for ORB, but NORM_L2 may be needed for other descriptors.
    # NORM_L2 uses OpenCV's brute-force matcher, which is single-threaded and deterministic.
    frontend:
      enable_viewer: true # false for faster runs without visualization.
      # Make OpenCV stochastic parts (e.g., RANSAC sampling) repeatable.
      cv_rng_seed: 2 # 0 for non-deterministic, fixed value for reproducible runs.
      # Keep single-threaded feature extraction/matching for reproducibility.
      cv_num_threads: 4 # 0 for OpenCV default, 1 for single-threaded, >1 for multi-threaded.

    input:
      # Larger queue + reliable QoS reduce run-to-run frame drops.
      queue_size: 10 # 10 for lower latency, 100+ for more reliable processing at the cost of higher memory usage and potential stalls.
      reliable_qos: false # false for faster runs with some frame drops, true for more reliable processing at the cost of potential stalls.
      # For ROS2, consider using "best_effort_qos" instead of "reliable_qos" for lower latency at the cost of potential frame drops.

    clahe:
      enabled: true # false to skip CLAHE contrast enhancement.
      clip_limit: 3.0 # higher = more contrast boost.
      tile_size: 8 # grid cell size (pixels) for local histogram equalization.

    mono:
      # Monocular VO has unknown metric scale.
      # Start near fr2_xyz scale; fine-tune using evo APE after first run.
      init_scale: 0.1

    # output:
    #   save_tum_trajectory: true
    #   tum_trajectory_path: "vo_trajectory_tum.txt"


    # ORB extractor params
    orb:
      n_features: 1500 # try 800 for faster runs, 2000 for more features.
      scale_factor: 1.2
      n_levels: 8 # This parameter controls the number of pyramid levels. More levels can help with scale invariance but increase computation.
      edge_threshold: 31
      first_level: 0
      wta_k: 2
      score_type: 0
      patch_size: 31
      fast_threshold: 20 # Lowering this can increase the number of detected features, but may also increase noise. Adjust based on your dataset and needs.
      # fast_threshold is the threshold for the FAST corner detector used in ORB. A lower value will detect more corners, while a higher value will be more selective. You may need to experiment with this parameter to find the right balance for your specific dataset and application.
      # n_threads: 4 # Set to 0 for OpenCV default, 1 for single-threaded, >1 for multi-threaded. Note that multi-threading may affect reproducibility.